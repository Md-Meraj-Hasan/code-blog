<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Panel</title>

  <!-- Tailwind CDN -->
 <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet"/>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            mono: ['"Share Tech Mono"', 'monospace'],
            orbitron: ['Orbitron', 'sans-serif'],
          },
          animation: {
            'fade-down': 'fadeDown 0.6s ease both',
            'fade-up':   'fadeUp 0.7s ease both',
            'pulse-dot': 'pulseDot 2s ease infinite',
          },
          keyframes: {
            fadeDown: {
              from: { opacity: '0', transform: 'translateY(-20px)' },
              to:   { opacity: '1', transform: 'translateY(0)' },
            },
            fadeUp: {
              from: { opacity: '0', transform: 'translateY(24px)' },
              to:   { opacity: '1', transform: 'translateY(0)' },
            },
            pulseDot: {
              '0%, 100%': { opacity: '1' },
              '50%':      { opacity: '0.25' },
            },
          },
        }
      }
    }
  </script>

  <style>
    /* Animated grid bg — pseudo-elements only, Tailwind can't do these */
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: linear-gradient(rgba(0,240,255,0.04) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(0,240,255,0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      animation: gridShift 20s linear infinite;
      pointer-events: none; z-index: 0;
    }
    body::after {
      content: ''; position: fixed; inset: 0;
      background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(123,47,255,0.12) 0%, transparent 70%),
                  radial-gradient(ellipse 50% 40% at 80% 100%, rgba(0,240,255,0.08) 0%, transparent 60%);
      pointer-events: none; z-index: 0;
    }
    @keyframes gridShift { 0% { transform: translateY(0); } 100% { transform: translateY(48px); } }
    @keyframes fadeDown  { from { opacity:0; transform:translateY(-20px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fadeUp    { from { opacity:0; transform:translateY(24px);  } to { opacity:1; transform:translateY(0); } }
    @keyframes pulseDot  { 0%,100% { opacity:1; } 50% { opacity:.25; } }

    /* clip-path — not in Tailwind core */
    .clip-nav    { clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px)); }
    .clip-card   { clip-path: polygon(0 0, calc(100% - 24px) 0, 100% 24px, 100% 100%, 24px 100%, 0 calc(100% - 24px)); }
    .clip-btn    { clip-path: polygon(12px 0%, 100% 0%, calc(100% - 12px) 100%, 0% 100%); }
    .clip-tag    { clip-path: polygon(6px 0%, 100% 0%, calc(100% - 6px) 100%, 0% 100%); }
    .clip-navbtn { clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%); }

    /* scanlines */
    .scanlines { position:fixed; inset:0; pointer-events:none; z-index:999;
      background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.08) 3px, rgba(0,0,0,0.08) 4px); }

    /* gradient text */
    .gradient-text {
      background: linear-gradient(135deg, #00f0ff 0%, #7b2fff 60%, #ff2d78 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }

    /* card corner accents */
    .card-corners::before, .card-corners::after { content:''; position:absolute; width:20px; height:20px; }
    .card-corners::before { top:-1px; right:22px; border-top:2px solid #00f0ff; border-right:2px solid #00f0ff; }
    .card-corners::after  { bottom:-1px; left:22px; border-bottom:2px solid #7b2fff; border-left:2px solid #7b2fff; }

    /* divider lines */
    .divider-line { flex:1; height:1px; background:linear-gradient(90deg, transparent, #00f0ff, transparent); opacity:.4; }

    /* textarea focus glow */
    textarea { caret-color:#00f0ff; }
    textarea:focus { outline:none; border-color:#00f0ff !important;
      box-shadow:0 0 20px rgba(0,240,255,0.35), 0 0 60px rgba(0,240,255,0.1), inset 0 0 20px rgba(0,240,255,0.05); }

    /* upload zone hover */
    .upload-zone:hover { border-color:#00f0ff; background:rgba(0,240,255,0.04);
      box-shadow:0 0 20px rgba(0,240,255,0.35), 0 0 60px rgba(0,240,255,0.1); }

    /* publish button effects */
    .btn-publish { position:relative; overflow:hidden; }
    .btn-publish::before { content:''; position:absolute; inset:0; background:linear-gradient(135deg,#00f0ff,#7b2fff); opacity:0; transition:opacity .25s; }
    .btn-publish:hover::before { opacity:1; }
    .btn-publish:hover { color:#fff !important; border-color:transparent !important;
      box-shadow:0 0 20px rgba(0,240,255,0.35), 0 0 60px rgba(0,240,255,0.1); }
    .btn-publish::after { content:''; position:absolute; left:0; top:-100%; width:100%; height:100%;
      background:linear-gradient(transparent 40%, rgba(255,255,255,.12) 50%, transparent 60%); transition:top .4s ease; }
    .btn-publish:hover::after { top:100%; }
    .btn-publish span { position:relative; z-index:1; }

    /* nav active */
    .nav-active { background:rgba(0,240,255,0.12) !important; border-color:#00f0ff !important; color:#00f0ff !important; }
  </style>
</head>

<body class="bg-[#050810] text-[#c8d8ff] font-['Share_Tech_Mono',monospace] min-h-screen overflow-x-hidden">

  <div class="scanlines"></div>

  <div class="relative z-10 max-w-4xl mx-auto px-6 py-8 pb-16">

    <!-- NAV -->
    <nav class="clip-nav flex items-center gap-2 bg-[rgba(10,15,30,0.85)] border border-[rgba(0,240,255,0.18)] px-4 py-2.5 mb-12 backdrop-blur-md animate-[fadeDown_0.6s_ease_both]"
         style="box-shadow:0 0 20px rgba(0,240,255,0.35),0 0 60px rgba(0,240,255,0.1)">

      <div class="font-['Orbitron'] font-black text-[0.82rem] tracking-widest text-[#00f0ff] mr-auto"
           style="text-shadow:0 0 20px rgba(0,240,255,0.5)">
        SYS<span class="text-[#ff2d78]">::</span>ADMIN
      </div>

      <ul class="flex gap-1 list-none">
        <li>
          <a href="/"
             class="clip-navbtn block px-4 py-1.5 border border-transparent bg-transparent text-[#3a4a6b] text-[0.72rem] tracking-widest uppercase no-underline transition-all duration-200 hover:text-[#00f0ff] hover:border-[rgba(0,240,255,0.18)] hover:bg-[rgba(0,240,255,0.07)]">
            Home
          </a>
        </li>
        <li>
          <a href="admin"
             class="clip-navbtn nav-active block px-4 py-1.5 border text-[0.72rem] tracking-widest uppercase no-underline transition-all duration-200"
             style="text-shadow:0 0 20px rgba(0,240,255,0.35)">
            Admin
          </a>
        </li>
        <li>
          <button type="button"
                  class="clip-navbtn block px-4 py-1.5 border border-transparent bg-transparent text-[#3a4a6b] text-[0.72rem] tracking-widest uppercase font-['Share_Tech_Mono'] cursor-pointer transition-all duration-200 hover:text-[#00f0ff] hover:border-[rgba(0,240,255,0.18)] hover:bg-[rgba(0,240,255,0.07)]">
            Contact
          </button>
        </li>
      </ul>
    </nav>

    <!-- HEADER -->
    <div class="text-center mb-12 animate-[fadeUp_0.7s_ease_both]">
      <p class="text-[0.68rem] tracking-[0.3em] text-[#7b2fff] uppercase mb-3">// secure terminal v2.4.1</p>
      <h1 class="gradient-text font-['Orbitron'] font-black text-4xl md:text-5xl tracking-tight leading-tight">
        Admin Coding Panel
      </h1>
      <p class="mt-3 text-[0.75rem] text-[#3a4a6b] tracking-widest">PUBLISH &nbsp;·&nbsp; DEPLOY &nbsp;·&nbsp; EXECUTE</p>
      <div class="flex items-center gap-4 mx-auto mt-5 max-w-xs">
        <div class="divider-line"></div>
        <div class="w-2 h-2 bg-[#00f0ff] rotate-45" style="box-shadow:0 0 20px rgba(0,240,255,0.5)"></div>
        <div class="divider-line"></div>
      </div>
    </div>

    <!-- FORM CARD -->
    <div class="card-corners clip-card relative bg-[rgba(10,15,30,0.9)] border border-[rgba(0,240,255,0.18)] p-10 backdrop-blur-xl animate-[fadeUp_0.7s_0.3s_ease_both]"
         style="box-shadow:0 0 20px rgba(0,240,255,0.35),0 0 60px rgba(0,240,255,0.1),inset 0 1px 0 rgba(255,255,255,0.04)">

      <form method="POST" enctype="multipart/form-data" class="space-y-8">

        <!-- SECTION 01: Code -->
        <div>
          <div class="flex items-center gap-3 mb-3">
            <span class="clip-tag bg-[#7b2fff] text-white text-[0.58rem] px-2 py-0.5 tracking-widest uppercase">01</span>
            <h3 class="font-['Orbitron'] font-bold text-[0.82rem] text-[#00f0ff] tracking-widest uppercase">Python Source Code</h3>
          </div>
          <div class="relative">
            <div id="lineNumbers"
                 class="absolute left-0 top-0 bottom-0 w-10 flex flex-col bg-[rgba(0,240,255,0.04)] border-r border-[rgba(0,240,255,0.18)] pt-4 overflow-hidden pointer-events-none select-none text-center">
            </div>
            <textarea
              name="code" id="codeArea" rows="10"
              placeholder="# Write your Python code here...&#10;print('Hello, World!')"
              spellcheck="false"
              class="w-full min-h-[200px] bg-[rgba(5,8,16,0.95)] border border-[rgba(0,240,255,0.18)] text-[#7efff5] font-['Share_Tech_Mono'] text-[0.83rem] leading-6 pl-14 pr-4 pt-4 pb-4 resize-y transition-all duration-200 placeholder-[#3a4a6b]"
            ></textarea>
          </div>
        </div>

        <!-- SECTION 02: Image -->
        <div>
          <div class="flex items-center gap-3 mb-3">
            <span class="clip-tag bg-[#7b2fff] text-white text-[0.58rem] px-2 py-0.5 tracking-widest uppercase">02</span>
            <h3 class="font-['Orbitron'] font-bold text-[0.82rem] text-[#00f0ff] tracking-widest uppercase">Output Image</h3>
          </div>
          <div id="uploadZone"
               class="upload-zone relative border border-dashed border-[#3a4a6b] bg-[rgba(5,8,16,0.8)] py-8 px-6 text-center cursor-pointer transition-all duration-200">
            <input type="file" name="image" id="fileInput" accept="image/*"
                   class="absolute inset-0 opacity-0 cursor-pointer w-full h-full" />
            <div class="text-3xl mb-2 opacity-60">⬡</div>
            <p class="text-[0.72rem] text-[#3a4a6b] tracking-widest">DRAG &amp; DROP IMAGE &nbsp;/&nbsp; CLICK TO SELECT</p>
            <p class="text-[0.62rem] text-[rgba(58,74,107,0.6)] mt-1 tracking-wider">PNG · JPG · WEBP · SVG · MAX 10MB</p>
            <p id="fileName" class="hidden mt-3 text-[0.68rem] text-[#00f0ff] tracking-wider"></p>
          </div>
        </div>

        <!-- SUBMIT -->
        <div class="flex items-center gap-6 pt-2">
          <button type="submit"
                  class="btn-publish clip-btn border border-[#00f0ff] text-[#00f0ff] font-['Orbitron'] font-bold text-[0.75rem] tracking-[0.22em] uppercase px-10 py-3 bg-transparent cursor-pointer transition-colors duration-200">
            <span>▶ &nbsp;Publish Post</span>
          </button>
          <div class="flex items-center gap-2 text-[0.62rem] text-[#3a4a6b] tracking-widest">
            <span class="w-1.5 h-1.5 rounded-full bg-[#1aff8a] animate-[pulseDot_2s_ease_infinite]"
                  style="box-shadow:0 0 8px #1aff8a"></span>
            SYSTEM ONLINE
          </div>
        </div>

      </form>
    </div>

  </div>

  <script>
    const ta = document.getElementById('codeArea');
    const ln = document.getElementById('lineNumbers');

    function updateLines() {
      const count = Math.max(ta.value.split('\n').length + 2, 10);
      ln.innerHTML = Array.from({length: count}, (_, i) =>
        `<span style="font-size:.62rem;color:#3a4a6b;line-height:1.5rem;display:block">${i+1}</span>`
      ).join('');
    }

    ta.addEventListener('input', updateLines);
    ta.addEventListener('scroll', () => { ln.scrollTop = ta.scrollTop; });
    updateLines();

    document.getElementById('fileInput').addEventListener('change', function () {
      const fn = document.getElementById('fileName');
      if (this.files.length) { fn.textContent = '✓ ' + this.files[0].name; fn.classList.remove('hidden'); }
    });

    const zone = document.getElementById('uploadZone');
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.style.borderColor='#00f0ff'; });
    zone.addEventListener('dragleave', () => { zone.style.borderColor='#3a4a6b'; });
    zone.addEventListener('drop',      () => { zone.style.borderColor='#3a4a6b'; });
  </script>

</body>
</html>
